<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ブロック de HTML エディタ</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;background:#eef1f5;color:#232a31;font-size:14px;user-select:none;-webkit-user-select:none;overflow:hidden;}
  input,select,textarea{user-select:text;-webkit-user-select:text;font-family:inherit;}
  #app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
  #topbar{flex:0 0 auto;display:flex;gap:8px;padding:6px 10px;background:#f4f6f9;border-bottom:1px solid #dfe4ea;align-items:center;flex-wrap:wrap;}
  .hist-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid #dfe4ea;background:#fff;border-radius:8px;font-size:12.5px;color:#3b4652;cursor:pointer;transition:.12s;font-family:inherit;}
  .hist-btn:hover:not(:disabled){background:#eef7f5;border-color:#8fd8c8;color:#1d9e83;}
  .hist-btn:disabled{opacity:.4;cursor:not-allowed;}
  .hist-btn .hi{font-size:15px;line-height:1;font-weight:700;}
  .help-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid #c3dbf5;background:#e8f4fd;border-radius:8px;font-size:12.5px;color:#0d3e6b;cursor:pointer;text-decoration:none;font-family:inherit;transition:.12s;font-weight:600;}
  .help-btn:hover{background:#d4ebfc;border-color:#4a9eff;color:#06305a;}
  .help-btn:active{transform:scale(0.97);}
  .hist-info{margin-left:auto;font-size:11px;color:#8b97a3;}
  #tabbar{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:5px;padding:8px 10px;background:#fff;border-bottom:1px solid #dfe4ea;align-items:flex-start;align-content:flex-start;}
  .tab{flex:0 0 auto;padding:6px 11px;border-radius:999px;border:1px solid #dfe4ea;background:#f8fafc;font-size:11.5px;color:#3b4652;cursor:pointer;white-space:nowrap;transition:.15s;line-height:1.3;}
  .tab:hover{background:#eef7f5;border-color:#8fd8c8;}
  .tab.active{background:#2ec4a6;border-color:#2ec4a6;color:#fff;font-weight:700;}
  .tab.preset-tab.active{background:#ff9800;border-color:#ff9800;}
  .tab.design-tab.active{background:#7e57c2;border-color:#7e57c2;}
  .tab.api-tab.active{background:#e91e63;border-color:#e91e63;}
  #main{flex:1 1 auto;display:grid;grid-template-columns:260px minmax(0,1fr) 340px;min-height:0;overflow:hidden;}
  #palette{background:#fff;border-right:1px solid #dfe4ea;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  #palette-head{flex:0 0 auto;padding:10px 12px;font-size:11.5px;font-weight:700;color:#5b6875;letter-spacing:.04em;border-bottom:1px solid #eef1f5;background:#fbfcfe;}
  
  /* 追加：ブロック説明エリア */
  #block-desc-box{flex:0 0 auto;padding:10px;background:#f0f7ff;border-bottom:1px solid #cce3f5;font-size:11.5px;line-height:1.5;color:#1e3a5f;}
  #block-desc-box label{font-weight:700;display:block;margin-bottom:4px;color:#0d3e6b;}
  #block-desc-select{width:100%;padding:4px 6px;border-radius:6px;border:1px solid #b3daff;background:#fff;margin-bottom:6px;font-size:11.5px;}
  #block-desc-text{background:#fff;border:1px solid #d0e3f7;border-radius:6px;padding:6px 8px;min-height:48px;max-height:90px;overflow-y:auto;word-break:break-all;color:#2c3e50;}

  #palette-list{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px;display:flex;flex-direction:column;gap:6px;overscroll-behavior:contain;}
  .pal-item{display:flex;align-items:stretch;gap:6px;padding:0;border:1px solid #dfe4ea;border-radius:10px;background:#fbfdff;font-size:12.5px;transition:.12s;flex:0 0 auto;touch-action:pan-y;overflow:hidden;min-height:42px;cursor:pointer;}
  .pal-item:hover{border-color:#8fd8c8;background:#f2fbf9;}
  .pal-item.preset-item{background:#fffbf2;border-color:#ffe0b2;}
  .pal-item.design-item{background:#f8f5ff;border-color:#e1d5f7;}
  .pal-item.api-item{background:#fff0f5;border-color:#f8bbd0;}
  .pal-item.selected-item{border-color:#2ec4a6;box-shadow:0 0 0 2px rgba(46,196,166,.3);background:#eafaf6;}
  .drag-handle{flex:0 0 auto;width:38px;display:flex;align-items:center;justify-content:center;background:#f1f5f8;color:#96a3b0;font-size:18px;cursor:grab;touch-action:none;user-select:none;line-height:1;font-weight:700;letter-spacing:-2px;padding-left:6px;}
  .drag-handle:active{cursor:grabbing;background:#c8e8e0;color:#0d8c72;}
  .pi-icon{font-size:15px;width:22px;text-align:center;flex:0 0 auto;align-self:center;}
  .pi-body{flex:1 1 auto;min-width:0;display:flex;align-items:center;padding:8px 8px 8px 0;}
  .pi-label{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3;}
  .preset-help,.design-help,.event-help,.api-help{font-size:11px;border-radius:8px;padding:8px 10px;line-height:1.6;margin-bottom:4px;}
  .preset-help{color:#8b6914;background:#fff8e1;border:1px solid #ffe0b2;}
  .design-help{color:#4a2f8b;background:#f0e9ff;border:1px solid #e1d5f7;}
  .event-help{color:#0d3e6b;background:#e8f4fd;border:1px solid #b3daff;}
  .api-help{color:#880e4f;background:#fff0f5;border:1px solid #f8bbd0;}
  .preset-group-head{font-size:11px;font-weight:700;color:#e65100;background:#fff3e0;padding:5px 8px;border-radius:6px;margin-top:6px;}
  .api-group-head{font-size:11px;font-weight:700;color:#880e4f;background:#fce4ec;padding:5px 8px;border-radius:6px;margin-top:6px;}
  .data-del{flex:0 0 auto;border:none;background:#f0f3f6;color:#8b97a3;border-radius:6px;width:26px;height:26px;cursor:pointer;align-self:center;margin-right:6px;}
  .data-del:hover{background:#ffe9e6;color:#d0442c;}
  .data-item.missing{opacity:.55;}
  .data-add{display:flex;gap:6px;margin-bottom:4px;}
  .data-add .act{flex:1 1 auto;font-size:11.5px;padding:7px 4px;}
  .data-empty{font-size:11.5px;color:#a8b3bd;padding:10px 4px;line-height:1.6;}
  .badge-miss{font-size:10px;color:#d0442c;background:#ffeae6;border-radius:4px;padding:1px 4px;margin-left:4px;align-self:center;}
  #workspace{min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px;background:#eef1f5;display:flex;flex-direction:column;position:relative;}
  #workspace.autoscroll-up::before,#workspace.autoscroll-down::after{content:'';position:sticky;left:0;right:0;height:40px;pointer-events:none;z-index:10;}
  #workspace.autoscroll-up::before{top:0;background:linear-gradient(to bottom,rgba(46,196,166,.35),transparent);}
  #workspace.autoscroll-down::after{bottom:0;background:linear-gradient(to top,rgba(46,196,166,.35),transparent);margin-top:-40px;}
  #root-slot{flex:1 1 auto;min-height:100%;padding:14px;background:#fff;border-radius:12px;border:2px solid #e3e9ef;}
  .ws-block{background:#f8fbfd;border:1px solid #dbe2ea;border-left:3px solid #2ec4a6;border-radius:10px;padding:8px;box-shadow:0 1px 2px rgba(20,30,40,.04);transition:box-shadow .12s, outline .12s;}
  .ws-block[data-cat="design"]{border-left-color:#7e57c2;background:#faf8ff;}
  .ws-block[data-cat="api"]{border-left-color:#e91e63;background:#fff8fa;}
  .ws-block.drag-over{outline:2px solid #2ec4a6;outline-offset:1px;}
  .ws-block.mini{display:flex;align-items:center;gap:6px;padding:5px 7px;border-left-color:#9aa7b3;background:#f4f7fa;border-radius:8px;}
  .move-handle{flex:0 0 auto;width:22px;text-align:center;color:#a3b0bc;font-size:14px;cursor:grab;touch-action:none;user-select:none;line-height:1;padding:4px 0;border-radius:5px;font-weight:700;letter-spacing:-2px;padding-left:6px;}
  .move-handle:active{cursor:grabbing;background:#c8e8e0;color:#1d9e83;}
  .mini-head{display:flex;align-items:center;gap:4px;flex:0 0 auto;font-size:11.5px;color:#4a5663;}
  .mini-name{font-weight:600;}
  .mini-fields{flex:1 1 auto;display:flex;gap:5px;align-items:center;min-width:0;flex-wrap:wrap;}
  .mini-fields .fld-row{flex:1 1 auto;min-width:0;}
  .mini-fields .fld-label{display:none;}
  .mini-fields .fld-hint,.mini-fields .fld-hint-id{display:none;}
  .mini-del{flex:0 0 auto;border:none;background:transparent;color:#b6c0c9;font-size:13px;cursor:pointer;padding:2px 5px;border-radius:5px;}
  .mini-del:hover{background:#ffe9e6;color:#d0442c;}
  .blk-head{display:flex;align-items:center;gap:5px;margin-bottom:6px;}
  .blk-name{font-size:12.5px;font-weight:700;color:#33404d;}
  .blk-tag{font-size:10.5px;color:#7e8b98;background:#eaeff4;border-radius:4px;padding:1px 5px;font-family:ui-monospace,Menlo,monospace;}
  .blk-hint{font-size:11px;color:#4a5663;background:#eaf4ff;border-left:3px solid #4a9eff;border-radius:6px;padding:5px 8px;margin-bottom:6px;line-height:1.5;}
  .sp{flex:1 1 auto;}
  .blk-btn{border:none;background:#eef2f6;color:#7a8794;border-radius:6px;width:24px;height:24px;font-size:12px;cursor:pointer;line-height:1;}
  .blk-btn[data-act="del"]:hover{background:#ffe9e6;color:#d0442c;}
  .blk-fields{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;}
  .fld-row{display:flex;align-items:center;gap:4px;padding:1px;border-radius:6px;}
  .fld-label{flex:0 0 auto;font-size:11px;color:#7e8b98;min-width:64px;}
  .fld-hint{flex:0 0 auto;font-size:11px;opacity:.35;padding:0 1px;}
  .fld-hint-id{flex:0 0 auto;font-size:10px;font-family:ui-monospace,Menlo,monospace;color:#8fa0b3;background:#f0f4f8;border-radius:3px;padding:1px 4px;cursor:help;opacity:.7;letter-spacing:-.5px;}
  .fld-hint-id:hover{background:#e0eaf4;color:#4a6a8b;opacity:1;}
  .fld{flex:1 1 auto;min-width:0;width:100%;padding:5px 7px;font-size:12px;border:1px solid #dbe2ea;border-radius:6px;background:#fff;color:#232a31;}
  .fld:focus{outline:none;border-color:#2ec4a6;box-shadow:0 0 0 2px rgba(46,196,166,.15);}
  .fld.fld-ref{background:#e8f4fd;border-color:#4a9eff;color:#0d3e6b;font-weight:600;}
  .fld.fld-ref:focus{box-shadow:0 0 0 2px rgba(74,158,255,.25);border-color:#4a9eff;}
  input[type="color"].fld{padding:1px;height:26px;cursor:pointer;}
  textarea.fld{resize:vertical;min-height:34px;}
  body.preset-drag .fld-hint{opacity:1;}
  .fld-row.preset-target{background:#fff8e1;box-shadow:inset 0 0 0 2px #ffb74d;animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{background:#fff8e1;}50%{background:#ffe9c4;}}
  .fld-row.preset-hover{background:#ffe0b2;box-shadow:inset 0 0 0 2px #ff9800;animation:none;}
  .blk-slots{display:flex;flex-direction:column;gap:4px;}
  .slot-row{display:flex;gap:5px;align-items:flex-start;}
  .slot-tag{flex:0 0 auto;font-size:9.5px;font-weight:700;color:#8b97a3;background:#eaeff4;border-radius:4px;padding:3px 5px;margin-top:2px;}
  .slot-tag.event-tag{background:#fde8c8;color:#a05a00;}
  .slot{flex:1 1 auto;min-width:0;min-height:30px;padding:5px;border:1.5px dashed #cdd7e0;border-radius:8px;background:#fdfefe;display:flex;flex-direction:column;gap:5px;}
  .slot:empty::after{content:attr(data-empty);font-size:11px;color:#aab5bf;}
  .slot.drag-over{border-color:#2ec4a6;background:#eafaf6;}
  .event-slot{border-color:#f0c67a;background:#fffdf5;}
  .event-slot:empty::after{color:#c49033;}
  .event-slot.drag-over{border-color:#ff9800;background:#fff5e0;}
  #drop-indicator{height:4px;border-radius:2px;background:#2ec4a6;flex:0 0 auto;margin:1px 0;}
  .drag-clone{position:fixed;z-index:9999;pointer-events:none;display:flex;align-items:center;gap:6px;padding:7px 12px;background:#2ec4a6;color:#fff;font-size:12.5px;font-weight:600;border-radius:99px;box-shadow:0 6px 18px rgba(20,30,40,.28);transform:translate(-50%,-50%);opacity:.94;}
  .drag-clone.preset-clone{background:#ff9800;}
  .drag-clone.design-clone{background:#7e57c2;}
  .drag-clone.move-clone{background:#6366f1;}
  .drag-clone.api-clone{background:#e91e63;}
  body.dragging{cursor:grabbing;}
  body.move-dragging{cursor:grabbing;}
  #right{background:#fff;border-left:1px solid #dfe4ea;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .panel-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #eef1f5;}
  .seg{display:flex;background:#eef2f6;border-radius:8px;padding:2px;}
  .seg button{border:none;background:transparent;font-size:11.5px;padding:5px 9px;border-radius:6px;cursor:pointer;color:#5b6875;}
  .seg button.active{background:#fff;color:#1d9e83;font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .fullscreen-btn{border:1px solid #dfe4ea;background:#fff;border-radius:8px;padding:5px 9px;font-size:14px;cursor:pointer;color:#5b6875;line-height:1;margin-left:4px;}
  #preview-area{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;padding:8px;gap:8px;}
  #preview-frame-wrap{flex:1 1 auto;min-height:0;display:flex;justify-content:center;background:#e9edf2;border-radius:9px;padding:6px;overflow:auto;}
  #preview-body{width:100%;height:100%;border:0;background:#fff;border-radius:6px;}
  #preview-body.mobile{width:375px;flex:0 0 auto;border:1px solid #c9d2dc;box-shadow:0 6px 18px rgba(20,30,40,.14);}
  #preview-code{flex:1 1 auto;min-height:0;margin:0;overflow:auto;background:#1f2733;color:#c9e8df;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;line-height:1.55;padding:10px;border-radius:9px;white-space:pre;user-select:text;}
  .hidden{display:none !important;}
  #action-area{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px;border-top:1px solid #eef1f5;max-height:42%;overflow-y:auto;}
  .act{padding:9px 6px;font-size:11.5px;border-radius:8px;border:1px solid #dfe4ea;background:#f8fafc;color:#3b4652;cursor:pointer;transition:.12s;}
  .act:hover{background:#eef7f5;border-color:#8fd8c8;}
  .act.primary{background:#2ec4a6;border-color:#2ec4a6;color:#fff;font-weight:700;}
  .act.danger{color:#c0392b;border-color:#f0d5d1;}
  #modal-overlay{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px;}
  #modal{background:#fff;border-radius:14px;padding:18px;width:min(480px,100%);max-height:82dvh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3);}
  #modal h3{margin:0 0 12px;font-size:15px;}
  .modal-field{display:block;margin-bottom:12px;}
  .modal-field span{display:block;font-size:11.5px;color:#7e8b98;margin-bottom:4px;}
  .modal-field input,.modal-field select{width:100%;padding:9px 10px;border:1px solid #dbe2ea;border-radius:8px;font-size:13px;background:#fff;font-family:inherit;}
  .slot-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .slot-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid #e3e9ef;border-radius:9px;background:#fbfcfe;}
  .slot-info{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .slot-info b{font-size:12px;}
  .slot-info span{font-size:11px;color:#8b97a3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .slot-item .act{flex:0 0 auto;padding:6px 10px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:6px;}
  .modal-msg{font-size:13px;line-height:1.75;color:#3b4652;white-space:pre-wrap;margin:0 0 16px;}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:#232a31;color:#fff;padding:10px 16px;border-radius:10px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:900;max-width:82vw;text-align:center;}
  #toast.show{opacity:.95;transform:translateX(-50%) translateY(0);}
  /* ID参照サジェスト */
  #ref-suggest{position:fixed;z-index:600;background:#fff;border:1px solid #b3daff;border-radius:10px;box-shadow:0 8px 24px rgba(20,30,40,.22);padding:9px 11px;font-size:12px;min-width:220px;max-width:320px;}
  #ref-suggest .rs-label{font-size:11.5px;color:#0d3e6b;margin-bottom:7px;line-height:1.5;}
  #ref-suggest .rs-label code{background:#e8f4fd;padding:1px 5px;border-radius:3px;font-family:ui-monospace,Menlo,monospace;color:#06305a;font-weight:700;word-break:break-all;}
  #ref-suggest .rs-actions{display:flex;gap:5px;}
  #ref-suggest .rs-btn{flex:1;padding:7px 8px;font-size:11.5px;border-radius:7px;border:1px solid #dfe4ea;background:#f8fafc;cursor:pointer;font-family:inherit;color:#3b4652;transition:.12s;line-height:1.3;}
  #ref-suggest .rs-btn:hover{background:#eef7f5;border-color:#8fd8c8;}
  #ref-suggest .rs-btn.primary{background:#2ec4a6;color:#fff;border-color:#2ec4a6;font-weight:700;}
  #ref-suggest .rs-btn.primary:hover{background:#26b096;}
  #preview-frame-wrap:fullscreen{background:#1f2733;padding:0;border-radius:0;align-items:center;}
  #preview-frame-wrap:fullscreen #preview-body{width:100%;height:100%;border-radius:0;max-width:none;}
  @media (max-width:1100px){#main{grid-template-columns:220px minmax(0,1fr) 300px;}.fld-label{min-width:52px;}}
  @media (max-width:840px){#main{grid-template-columns:180px minmax(0,1fr) 250px;}.tab{padding:5px 9px;font-size:11px;}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <button class="hist-btn" id="btn-undo" disabled><span class="hi">↶</span><span>戻る</span></button>
    <button class="hist-btn" id="btn-redo" disabled><span class="hi">↷</span><span>やり直す</span></button>
    <a class="help-btn" id="btn-help" href="https://tamani3901.github.io/HTMLEditorhelp/" target="_blank" rel="noopener">📖 使い方</a>
    <span class="hist-info" id="hist-info"></span>
  </header>
  <header id="tabbar"></header>
  <div id="main">
    <aside id="palette">
      <div id="palette-head">かんたん入力</div>
      
      <!-- ブロック説明用ドロップダウンエリア -->
      <div id="block-desc-box">
        <label for="block-desc-select">💡 ブロックの説明を見る:</label>
        <select id="block-desc-select">
          <option value="">-- ブロックを選択してください --</option>
        </select>
        <div id="block-desc-text">ブロックを選択すると、ここに機能や使用方法の説明が表示されます。</div>
      </div>

      <div id="palette-list"></div>
    </aside>
    <section id="workspace"><div id="root-slot" class="slot" data-slot="container" data-empty="ここにブロックをドロップ"></div></section>
    <aside id="right">
      <div class="panel-head">
        <div class="seg" id="view-seg"><button data-view="preview" class="active">プレビュー</button><button data-view="code">コード</button></div>
        <div style="display:flex;align-items:center;gap:4px;">
          <div class="seg" id="vp-seg"><button data-vp="desktop" class="active">🖥</button><button data-vp="mobile">📱</button></div>
          <button class="fullscreen-btn" id="btn-fullscreen">⛶</button>
        </div>
      </div>
      <div id="preview-area"><div id="preview-frame-wrap"><iframe id="preview-body"></iframe></div><pre id="preview-code" class="hidden"></pre></div>
      <div id="action-area">
        <button class="act primary" id="btn-export">📄 HTMLエクスポート</button>
        <button class="act" id="btn-import">📥 ファイルインポート</button>
        <button class="act" id="btn-save">💾 セーブ</button>
        <button class="act" id="btn-load">📂 セーブ読み込み</button>
        <button class="act" id="btn-json">⬇ JSON書き出し</button>
        <button class="act" id="btn-settings">⚙ 設定</button>
        <button class="act danger" id="btn-save-reset">🗑 セーブリセット</button>
        <button class="act danger" id="btn-reset">♻ プロジェクトリセット</button>
      </div>
    </aside>
  </div>
</div>
<input type="file" id="file-input" accept="*/*" multiple class="hidden">
<div id="modal-overlay" class="hidden"><div id="modal"></div></div>
<div id="ref-suggest" class="hidden">
  <div class="rs-label"></div>
  <div class="rs-actions">
    <button class="rs-btn" type="button" data-action="text">文字として使う</button>
    <button class="rs-btn primary" type="button" data-action="ref">ID参照にする</button>
  </div>
</div>
<div id="toast"></div>
<div id="drop-indicator" class="hidden"></div>

// 残りの初期データや状態保持
let currentTab = 'presets';
let workspaceData = [];
let historyStack = [];
let historyIndex = -1;
let selectedBlockKeyForDesc = '';

// DOM初期化
document.addEventListener('DOMContentLoaded', () => {
  renderTabs();
  initDescSelect();
  renderPalette();
  setupEventListeners();
  updateWorkspace();
});

// ブロック説明用プルダウンの初期化
function initDescSelect(){
  const sel = $('#block-desc-select');
  sel.innerHTML = '<option value="">-- ブロックを選択してください --</option>';
  
  // プリセット・通常ブロックをセレクトボックスに格納
  const optGroupPresets = document.createElement('optgroup');
  optGroupPresets.label = "🎁 プリセット";
  Object.keys(PRESETS).forEach(k => {
    const p = PRESETS[k];
    const opt = document.createElement('option');
    opt.value = k;
    opt.textContent = `${p.icon} ${p.label}`;
    optGroupPresets.appendChild(opt);
  });
  sel.appendChild(optGroupPresets);

  CATEGORIES.forEach(cat => {
    if(cat.id === 'presets' || cat.id === 'data') return;
    const group = document.createElement('optgroup');
    group.label = cat.label;
    Object.keys(BLOCKS).forEach(bk => {
      const b = BLOCKS[bk];
      if(b.cat === cat.id){
        const opt = document.createElement('option');
        opt.value = bk;
        opt.textContent = `${b.icon} ${b.label}`;
        group.appendChild(opt);
      }
    });
    if(group.children.length > 0) sel.appendChild(group);
  });

  sel.addEventListener('change', (e) => {
    showBlockDescription(e.target.value);
  });
}

// 説明テキストを表示する処理
function showBlockDescription(key){
  const txtBox = $('#block-desc-text');
  const sel = $('#block-desc-select');   sel.value = key;    $$('.pal-item').forEach(item => {
    if(item.dataset.key === key){
      item.classList.add('selected-item');
    } else {
      item.classList.remove('selected-item');
    }
  });

  if(!key){
    txtBox.textContent = "ブロックを選択すると、ここに機能や使用方法の説明が表示されます。";
    return;
  }

  if(PRESETS[key]){
    const p = PRESETS[key];
    txtBox.innerHTML = `<b>【プリセット】${p.icon} ${p.label}</b><br>${escapeHtml(p.desc || '設定値のショートカットです。')}<br><small style="color:#777;">値: ${escapeHtml(p.value)}</small>`;
  } else if(BLOCKS[key]){
    const b = BLOCKS[key];
    txtBox.innerHTML = `<b>【${b.label}】 (HTML: &lt;${b.tag}&gt;)</b><br>${escapeHtml(b.desc || 'HTML/CSS要素の作成ブロックです。')}`;
  } else {
    txtBox.textContent = "説明が登録されていない項目です。";
  }
}

// タブの描画
function renderTabs(){
  const tb = $('#tabbar');
  tb.innerHTML = '';
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = `tab ${c.id === currentTab ? 'active' : ''} ${c.id === 'presets' ? 'preset-tab' : ''} ${c.id === 'design' ? 'design-tab' : ''} ${c.id === 'api' ? 'api-tab' : ''}`;
    btn.textContent = c.label;
    btn.onclick = () => {
      currentTab = c.id;
      renderTabs();
      renderPalette();
    };
    tb.appendChild(btn);
  });
}

// パレットリストの描画
function renderPalette(){
  const pl = $('#palette-list');
  pl.innerHTML = '';

  if(currentTab === 'presets'){
    let lastGrp = '';
    Object.keys(PRESETS).forEach(pk => {
      const p = PRESETS[pk];
      if(p.group !== lastGrp){
        const gh = document.createElement('div');
        gh.className = 'preset-group-head';
        gh.textContent = PRESET_GROUPS[p.group] || p.group;
        pl.appendChild(gh);
        lastGrp = p.group;
      }
      const item = createPaletteItem(pk, p.label, p.icon, 'preset-item');
      pl.appendChild(item);
    });
  } else {
    Object.keys(BLOCKS).forEach(bk => {
      const b = BLOCKS[bk];
      if(b.cat === currentTab){
        const cls = b.cat === 'design' ? 'design-item' : b.cat === 'api' ? 'api-item' : '';
        const item = createPaletteItem(bk, b.label, b.icon, cls);
        pl.appendChild(item);
      }
    });
  }
}

// パレットの各アイテム要素生成
function createPaletteItem(key, label, icon, extraClass){
  const div = document.createElement('div');
  div.className = `pal-item ${extraClass || ''}`;
  div.dataset.key = key;

  div.innerHTML = `
    <div class="drag-handle" title="ドラッグして配置">⋮⋮</div>
    <div class="pi-body">
      <span class="pi-icon">${icon}</span>
      <span class="pi-label">${escapeHtml(label)}</span>
    </div>
  `;

  // クリックした際に説明欄に反映
  div.addEventListener('click', () => {
    showBlockDescription(key);
  });

  // ドラッグ開始の処理
  const handle = div.querySelector('.drag-handle');
  handle.addEventListener('mousedown', (e) => startDrag(e, key));
  handle.addEventListener('touchstart', (e) => startDrag(e, key), {passive:false});

  return div;
}

// ドラッグ＆ドロップ用ダミー実装
function startDrag(e, key){
  e.preventDefault();
  showBlockDescription(key);
  toast(`「${BLOCKS[key]?.label || PRESETS[key]?.label}」を選択中 (ワークスペースに配置できます)`);
}

// イベントリスナーのセットアップ
function setupEventListeners(){
  $('#btn-export').onclick = () => toast('📄 HTMLを出力しました！');
  $('#btn-save').onclick = () => toast('💾 プロジェクトを保存しました！');
  $('#btn-reset').onclick = () => {
    if(confirm('プロジェクトを初期化しますか？')){
      $('#root-slot').innerHTML = '';
      toast('♻ リセット完了');
    }
  };

  // プレビュー表示切替
  $$('#view-seg button').forEach(b => {     b.onclick = () => {       $$
('#view-seg button').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      if(b.dataset.view === 'code'){
        $('#preview-frame-wrap').classList.add('hidden');
        $('#preview-code').classList.remove('hidden');
        $('#preview-code').textContent = '<!-- ここに生成されたHTML/CSSが表示されます -->\n<div class="box">\n  <h1>サンプルページ</h1>\n</div>';
      } else {
        $('#preview-frame-wrap').classList.remove('hidden');
        $('#preview-code').classList.add('hidden');
      }
    };
  });
}

  // 簡易初期化表示
}
